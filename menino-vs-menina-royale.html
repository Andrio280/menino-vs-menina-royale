<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Menino vs Menina – Arena</title>
<style>
:root{--bg:#f4f1ff;--fg:#1d1b2e;--card:#fff;--b:#2f7bff;--g:#ff3d9a;--mute:#6b6880;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14122a;--fg:#f2f0ff;--card:#221f40;--mute:#a7a3c4}}
:root[data-theme="dark"]{--bg:#14122a;--fg:#f2f0ff;--card:#221f40;--mute:#a7a3c4}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:440px;margin-inline:auto;padding:10px}
h1{font-size:1.1rem;text-align:center;margin:2px 0 6px}
.score{display:flex;justify-content:space-between;font-weight:800;font-size:.9rem}
.score .b{color:var(--b)}.score .g{color:var(--g)}.score .m{color:var(--mute);font-weight:600}
canvas{width:100%;display:block;border-radius:14px;margin:6px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.col{background:var(--card);border-radius:14px;padding:8px}
.col h2{margin:0 0 6px;font-size:.9rem}
.col.b h2{color:var(--b)}.col.g h2{color:var(--g)}
button{width:100%;margin:2px 0;padding:6px 8px;border:0;border-radius:9px;font-size:.8rem;font-weight:700;color:#fff;cursor:pointer;text-align:left}
button small{display:block;font-weight:400;opacity:.9;font-size:.68rem}
.col.b button{background:var(--b)}.col.g button{background:var(--g)}
button:active{transform:scale(.97)}
.feed{background:var(--card);border-radius:14px;padding:8px 10px;margin-top:8px;min-height:60px;font-size:.82rem}
.mute{color:var(--mute);font-size:.72rem;text-align:center;margin-top:6px}

/* ===== Royale 2.0: modo de transmissão ===== */
body.live{max-width:none;width:100vw;height:100dvh;overflow:hidden;display:flex;flex-direction:column;align-items:center;padding:clamp(8px,1.5vh,22px);gap:clamp(4px,1vh,12px)}
body.live h1{font-size:clamp(18px,2.4vh,34px);margin:0}
body.live .score{width:min(100%,760px);font-size:clamp(14px,2vh,26px);gap:8px}
body.live canvas{height:min(72dvh,calc(100dvh - 190px));width:auto;max-width:100%;object-fit:contain;margin:0 auto;flex:0 1 auto}
body.live .grid,body.live .mute{display:none}
body.live .feed{width:min(100%,760px);min-height:48px;max-height:12dvh;overflow:hidden;font-size:clamp(12px,1.5vh,20px);margin:0}
#connection{font-size:12px;color:var(--mute);text-align:center}
#connection[data-state="connected"]{color:#35c98a}
#connection[data-state="disconnected"]{color:#ff9b72}
@media (max-width:520px){body.live{padding:7px}body.live canvas{height:min(70dvh,calc(100dvh - 170px))}}
</style>
</head>
<body>
<h1>👦 Menino vs Menina 👧</h1>
<div class="score"><span class="b">Meninos: <span id="sb">0</span></span><span class="m">Partida #<span id="mt">1</span></span><span class="g">Meninas: <span id="sg">0</span></span></div>
<div id="connection" data-state="disconnected">Modo de teste • aguardando servidor</div>
<canvas id="c"></canvas>
<div class="grid">
  <div class="col b"><h2>Time Menino</h2><div id="btnsB"></div></div>
  <div class="col g"><h2>Time Menina</h2><div id="btnsG"></div></div>
</div>
<div class="feed" id="feed"><span style="color:var(--mute)">Os presentes aparecem aqui…</span></div>
<div class="mute">Protótipo: os botões simulam presentes. As partidas se repetem sozinhas até você encerrar a live.</div>

<script>
const $=id=>document.getElementById(id),cv=$("c"),x=cv.getContext("2d"),W=360,H=620,RY=310,LX=[90,270],DPR=Math.min(2,window.devicePixelRatio||1),MAXU=110;
const LIVE_MODE=new URLSearchParams(location.search).get("mode")==="live";
if(LIVE_MODE)document.body.classList.add("live");
const pendingGiftQueue=[];
cv.width=W*DPR;cv.height=H*DPR;x.scale(DPR,DPR);
const rnd=(a,b)=>a+Math.random()*(b-a);
const TY={
 sold:{hp:40,dmg:6,spd:45,rng:16,cd:.7,r:8},
 arq:{hp:25,dmg:6,spd:38,rng:85,cd:.9,r:7.5},
 esq:{hp:14,dmg:3,spd:55,rng:12,cd:.6,r:5},
 tank:{hp:220,dmg:14,spd:30,rng:18,cd:1,r:12,tow:1},
 drag:{hp:110,dmg:14,spd:60,rng:40,cd:.8,r:10,fly:1},
 gig:{hp:600,dmg:34,spd:22,rng:22,cd:1.3,r:17,tow:1},
 bomb:{hp:20,dmg:0,spd:65,rng:14,cd:99,r:6,bomb:1},
 dino:{hp:30,dmg:5,spd:85,rng:14,cd:.5,r:6},
 med:{hp:35,dmg:0,spd:40,rng:0,cd:.8,r:7,med:1},
 cap:{hp:200,dmg:4,spd:26,rng:16,cd:1,r:10}};
const COL={b:"#2f7bff",g:"#ff3d9a"},DK={b:"#1b4fb8",g:"#b81d6e"};
let BUF={b:{spd:0,rage:0},g:{spd:0,rage:0}},U=[],E=[],P=[],PT=[],T,sc={b:0,g:0},over=null,tm=150,ov=0,matches=0,shk=0,now=0,queueCooldown=0;
const foe=t=>t==="b"?"g":"b";

// ===== Fundo pré-renderizado (grama, pedra, rio, árvores) =====
const bg=document.createElement("canvas");bg.width=W*DPR;bg.height=H*DPR;
function makeBG(){
 const b=bg.getContext("2d");b.scale(DPR,DPR);
 let g=b.createLinearGradient(0,0,0,H);g.addColorStop(0,"#4a8a3b");g.addColorStop(.5,"#5fa34b");g.addColorStop(1,"#4a8a3b");
 b.fillStyle=g;b.fillRect(0,0,W,H);
 for(let y=0;y<H;y+=40){b.fillStyle=(y/40)%2?"rgba(255,255,255,.04)":"rgba(0,0,0,.04)";b.fillRect(0,y,W,40)}
 for(let i=0;i<1100;i++){b.strokeStyle="rgba("+rnd(20,70)+","+rnd(100,160)+","+rnd(20,60)+",.4)";b.lineWidth=1;const a=rnd(0,W),c=rnd(0,H);b.beginPath();b.moveTo(a,c);b.lineTo(a+rnd(-2,2),c-rnd(3,7));b.stroke()}
 b.fillStyle="rgba(255,61,154,.09)";b.fillRect(0,0,W,RY);b.fillStyle="rgba(47,123,255,.09)";b.fillRect(0,RY,W,H-RY);
 LX.forEach(l=>{
  b.fillStyle="#b3a283";b.fillRect(l-30,0,60,H);
  for(let i=0;i<340;i++){b.fillStyle="rgba("+(120+rnd(0,70))+","+(105+rnd(0,60))+","+(80+rnd(0,40))+",.55)";b.fillRect(l-29+rnd(0,54),rnd(0,H),rnd(4,9),rnd(3,6))}
  b.fillStyle="rgba(0,0,0,.25)";b.fillRect(l-31,0,2,H);b.fillRect(l+29,0,2,H);
 });
 const rg=b.createLinearGradient(0,RY-20,0,RY+20);rg.addColorStop(0,"#2670b8");rg.addColorStop(.5,"#52b0ee");rg.addColorStop(1,"#2670b8");
 b.fillStyle=rg;b.fillRect(0,RY-20,W,40);b.fillStyle="#3a2c1c";b.fillRect(0,RY-22,W,3);b.fillRect(0,RY+19,W,3);
 for(let i=0;i<16;i++){const side=i%2?rnd(4,22):rnd(W-22,W-4),y=rnd(10,H-10);if(Math.abs(y-RY)<30)continue;
  b.fillStyle="rgba(0,0,0,.25)";b.beginPath();b.ellipse(side+5,y+8,13,6,0,0,7);b.fill();
  const rr=b.createRadialGradient(side-4,y-5,2,side,y,14);rr.addColorStop(0,"#5fbf56");rr.addColorStop(1,"#256b2a");
  b.fillStyle=rr;b.beginPath();b.arc(side,y,12,0,7);b.fill()}
}
makeBG();

function reset(first){
 const mk=t=>{const b=t==="b";return[
  {x:90,y:b?470:150,hp:500,mx:500,cd:0,fz:0},{x:270,y:b?470:150,hp:500,mx:500,cd:0,fz:0},
  {x:180,y:b?565:55,hp:900,mx:900,cd:0,fz:0,k:1}]};
 T={b:mk("b"),g:mk("g")};U=[];E=[];P=[];PT=[];over=null;tm=150;BUF={b:{spd:0,rage:0},g:{spd:0,rage:0}};
 matches++;$("mt").textContent=matches;
}
function spawn(t,type,user,n,ln){
 if(ln==null)ln=Math.random()<.5?0:1;
 for(let i=0;i<n&&U.length<MAXU;i++)U.push({t,type,ln,s:0,ox:rnd(-14,14),hp:TY[type].hp,x:LX[ln]+rnd(-18,18),y:(t==="b"?505:115)+rnd(-10,10),cd:rnd(0,.4),a:0,mv:0,ph:rnd(0,6),fz:0,user});
}
function burst(px,py,n,col,sp,life,g){for(let i=0;i<n;i++){const a=rnd(0,6.28),v=rnd(.2,1)*sp;PT.push({x:px,y:py,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:life*rnd(.6,1),ml:life,c:col,s:rnd(1.5,3.5),g:g==null?120:g})}}
function boom(px,py,sz){burst(px,py,22,"#ff9a2a",150,.6);burst(px,py,16,"#ffd36a",110,.5);burst(px,py,16,"rgba(70,70,70,.8)",60,1.2,-30);burst(px,py,10,"#8a8270",140,.8);E.push({k:"boom",x:px,y:py,r:sz+20,l:.4})}
function win(t){
 if(over)return;over=t;ov=9;
 if(t!=="d"){sc[t]++;$("sb").textContent=sc.b;$("sg").textContent=sc.g}
}
function dmgT(f,tw,d){
 if(over||tw.hp<=0)return;tw.hp=Math.max(0,tw.hp-d);burst(tw.x+rnd(-10,10),tw.y+rnd(-10,10),2,"#cfc8b6",60,.5);
 if(tw.hp<=0){boom(tw.x,tw.y,tw.k?40:28);shk=.7;txt(tw.x,tw.y-45,"TORRE DERRUBADA!","#fff");if(tw.k)win(foe(f))}
}
const tgtTower=u=>{const p=T[foe(u.t)][u.ln];return p.hp>0?p:T[foe(u.t)][2]};
function fire(t,ln,dmg,td,delay){
 const f=foe(t),en=U.filter(u=>u.t===f&&u.ln===ln);
 const y=en.length?en.reduce((a,u)=>a+u.y,0)/en.length:T[f][ln].y;
 E.push({k:"spell",f,x:LX[ln],y,r:55,dmg,td,l:.7+(delay||0)});
}
function txt(xx,yy,s,col){E.push({k:"txt",x:xx,y:yy,s,col,l:1.8})}

// ===== Presentes = cartas (edite nomes e poderes aqui) =====
const buff=(t,k,txtS)=>{BUF[t][k]=6;txt(T[t][2].x,T[t][2].y+(t==="b"?-62:62),txtS,COL[t])};
const GIFTS=[
 {name:"Rosa",e:"🌹",d:"1 Soldado",fn:(t,u)=>spawn(t,"sold",u,1)},
 {name:"Bomba",e:"💣",d:"Kamikaze: explode nos inimigos",fn:(t,u)=>spawn(t,"bomb",u,1)},
 {name:"Velocidade",e:"⚡",d:"Tropas 60% mais rápidas por 6s",fn:t=>buff(t,"spd","⚡ VELOCIDADE!")},
 {name:"Fúria",e:"😡",d:"Tropas com dano dobrado por 6s",fn:t=>buff(t,"rage","😡 FÚRIA!")},
 {name:"Sorvete",e:"🍦",d:"2 Arqueiros",fn:(t,u)=>spawn(t,"arq",u,2)},
 {name:"Curandeiro",e:"💚",d:"Cura as tropas ao redor",fn:(t,u)=>spawn(t,"med",u,1)},
 {name:"Coração",e:"💖",d:"Horda de 6 mini-guerreiros",fn:(t,u)=>spawn(t,"esq",u,6)},
 {name:"Mini dino",e:"🦖",d:"2 dinos rápidos",fn:(t,u)=>spawn(t,"dino",u,2)},
 {name:"Cura",e:"💊",d:"+250 na torre mais fraca",fn:t=>{const a=T[t].filter(w=>w.hp>0).sort((p,q)=>p.hp/p.mx-q.hp/q.mx)[0];if(a){a.hp=Math.min(a.mx,a.hp+250);burst(a.x,a.y,14,"#7dff9a",60,.9,-40)}}},
 {name:"Capivara",e:"🦫",d:"Bloqueador bem resistente",fn:(t,u)=>spawn(t,"cap",u,1)},
 {name:"Meteoro",e:"☄️",d:"Bola de fogo na pista",fn:t=>{const f=foe(t),c=ln=>U.filter(u=>u.t===f&&u.ln===ln).length,ln=c(0)>c(1)?0:c(1)>c(0)?1:(Math.random()<.5?0:1);fire(t,ln,90,110);fire(t,ln,60,70,.3)}},
 {name:"Leão",e:"🦁",d:"Tanque: ataca só torres",fn:(t,u)=>spawn(t,"tank",u,1)},
 {name:"Gelo",e:"❄️",d:"Congela inimigos 4s",fn:t=>{const f=foe(t);U.forEach(u=>{if(u.t===f)u.fz=4});T[f].forEach(w=>w.fz=4);E.push({k:"flash",l:.25,c:"150,220,255"})}},
 {name:"Dragão",e:"🐉",d:"Dragão voador",fn:(t,u)=>spawn(t,"drag",u,1)},
 {name:"Universo",e:"🌌",d:"Gigante + chuva de fogo",fn:(t,u)=>{spawn(t,"gig",u,1);fire(t,0,80,150);fire(t,1,80,150,.2);E.push({k:"flash",l:.35,c:"255,255,255"})}}
];

function att(u,S,tg,tw,f){
 if(S.med)return;
 if(S.bomb){U.forEach(v=>{if(v.t===f&&Math.hypot(v.x-u.x,v.y-u.y)<48)v.hp-=70});T[f].forEach(w=>{if(w.hp>0&&Math.hypot(w.x-u.x,w.y-u.y)<44)dmgT(f,w,70)});u.hp=0;boom(u.x,u.y,24);return}
 const dm=S.dmg*(BUF[u.t].rage>0?2:1);u.cd=S.cd;u.a=.2;
 if(S.rng>50||S.fly)P.push({x:u.x,y:u.y-12-(S.fly?18:0),tg,tw:tg===tw,f,dmg:dm,k:S.fly?"f":"a",sp:S.fly?200:260,a:0});
 else{if(tg===tw)dmgT(f,tw,dm);else tg.hp-=dm;burst(tg.x,tg.y-8,3,"#ffe9a0",70,.25,0)}
}
function step(dt){
 for(const p of PT){p.l-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.g*dt}
 PT=PT.filter(p=>p.l>0);
 for(const e of E){
  e.l-=dt;if(e.k==="txt")e.y-=20*dt;
  if(e.k==="spell"&&e.l<=0&&!over){
   U.forEach(u=>{if(u.t===e.f&&Math.hypot(u.x-e.x,u.y-e.y)<e.r)u.hp-=e.dmg});
   T[e.f].forEach(w=>{if(w.hp>0&&Math.hypot(w.x-e.x,w.y-e.y)<e.r+16)dmgT(e.f,w,e.td)});
   boom(e.x,e.y,e.r*.6);shk=Math.max(shk,.25);
  }
 }
 E=E.filter(e=>e.l>0);shk=Math.max(0,shk-dt*1.4);
 if(over){ov-=dt;if(ov<=0)reset();return}
 queueCooldown-=dt;if(queueCooldown<=0&&pendingGiftQueue.length){const next=pendingGiftQueue.shift();gift(next.team,next.card,next.user);queueCooldown=.35}
 tm-=dt;for(const t of["b","g"]){BUF[t].spd=Math.max(0,BUF[t].spd-dt);BUF[t].rage=Math.max(0,BUF[t].rage-dt)}
 if(tm<=0){const s=t=>T[t].reduce((a,v)=>a+v.hp,0),a=s("b"),b=s("g");win(a>b?"b":b>a?"g":"d")}
 for(const t of["b","g"])for(const tw of T[t]){
  if(tw.hp<=0)continue;if(tw.fz>0){tw.fz-=dt;continue}
  tw.cd-=dt;if(tw.cd>0)continue;
  let tg=null,bd=tw.k?140:120;
  for(const v of U)if(v.t!==t){const d=Math.hypot(v.x-tw.x,v.y-tw.y);if(d<bd){bd=d;tg=v}}
  if(tg){tw.cd=1;P.push({x:tw.x,y:tw.y-20,tg,tw:false,f:foe(t),dmg:tw.k?12:9,k:tw.k?"c":"a",sp:300,a:0})}
 }
 for(const u of U){
  const S=TY[u.type],f=foe(u.t),dy=u.t==="b"?-1:1;u.ph+=dt;u.cd-=dt;u.a-=dt;u.mv=0;
  if(u.fz>0){u.fz-=dt;continue}
  if(S.med&&u.cd<=0){u.cd=S.cd;U.forEach(v=>{if(v.t===u.t&&v!==u&&v.hp<TY[v.type].hp&&Math.hypot(v.x-u.x,v.y-u.y)<65){v.hp=Math.min(TY[v.type].hp,v.hp+14);burst(v.x,v.y-12,2,"#7dff9a",30,.6,-30)}})}
  const tw=tgtTower(u);let tg=null,bd=1e9;
  if(!S.tow&&!S.med)for(const v of U)if(v.t===f){
   const d=Math.hypot(v.x-u.x,v.y-u.y);
   if(d<bd&&(d<=S.rng||(d<=70&&(v.y<RY)===(u.y<RY)))){bd=d;tg=v}
  }
  let gx,gy,inR=false;
  if(tg){gx=tg.x;gy=tg.y;inR=bd<=S.rng}
  else{
   if(S.fly)u.s=2;
   if(u.s===0){gx=LX[u.ln]+u.ox*.4;gy=RY-dy*44;if(Math.hypot(gx-u.x,gy-u.y)<8)u.s=1}
   if(u.s===1){gx=LX[u.ln]+u.ox*.4;gy=RY+dy*44;if(Math.abs(gy-u.y)<8)u.s=2}
   if(u.s===2){gx=tw.x;gy=tw.y}
   if(Math.hypot(tw.x-u.x,tw.y-u.y)<=S.rng+22){inR=true;tg=tw}
  }
  if(inR){if(u.cd<=0)att(u,S,tg,tw,f)}
  else{const ddx=gx-u.x,ddy=gy-u.y,d=Math.hypot(ddx,ddy)||1;const sp=S.spd*(BUF[u.t].spd>0?1.6:1);u.x+=ddx/d*sp*dt;u.y+=ddy/d*sp*dt;u.mv=1}
 }
 // separação entre aliados + limites da ponte/rio
 for(let i=0;i<U.length;i++){const a=U[i],A=TY[a.type];
  for(let j=i+1;j<U.length;j++){const b=U[j];if(a.t!==b.t)continue;const B=TY[b.type];if(!A.fly!==!B.fly)continue;
   const dx=b.x-a.x,dyy=b.y-a.y,d=Math.hypot(dx,dyy)||.01,m=(A.r+B.r)*.6;
   if(d<m){const k=(m-d)/2/d;a.x-=dx*k;a.y-=dyy*k;b.x+=dx*k;b.y+=dyy*k}}
  if(!A.fly&&Math.abs(a.y-RY)<22){
   const l=LX[Math.abs(a.x-LX[0])<Math.abs(a.x-LX[1])?0:1];
   if(Math.abs(a.x-l)>28)a.y=a.y<RY?RY-22:RY+22;else a.x=Math.max(l-26,Math.min(l+26,a.x));
  }
  a.x=Math.max(8,Math.min(W-8,a.x));
 }
 for(const p of P){
  if(!p.tw&&p.tg.hp<=0){p.dead=1;continue}
  const tx=p.tg.x,ty=p.tg.y-(p.tw?0:8),dx=tx-p.x,dyy=ty-p.y,d=Math.hypot(dx,dyy);
  if(d<7){p.dead=1;if(p.tw)dmgT(p.f,p.tg,p.dmg);else p.tg.hp-=p.dmg;burst(tx,ty,4,p.k==="f"?"#ff9a2a":"#ffe9a0",80,.3,0)}
  else{p.x+=dx/d*p.sp*dt;p.y+=dyy/d*p.sp*dt;p.a=Math.atan2(dyy,dx)}
 }
 P=P.filter(p=>!p.dead);
 U=U.filter(u=>{if(u.hp<=0){burst(u.x,u.y-6,7,"#e8e2d0",50,.5,-10);return false}return true});
}

// ===== Desenho =====
function dragon(u){
 const w=Math.sin(u.ph*14)*12,c=COL[u.t],dk=DK[u.t];
 x.scale(1,u.t==="g"?-1:1);
 x.fillStyle=dk;
 x.beginPath();x.moveTo(-3,-12);x.quadraticCurveTo(-28,-26-w,-32,-4-w*.5);x.lineTo(-18,-7);x.lineTo(-3,-3);x.fill();
 x.beginPath();x.moveTo(3,-12);x.quadraticCurveTo(28,-26-w,32,-4-w*.5);x.lineTo(18,-7);x.lineTo(3,-3);x.fill();
 x.strokeStyle=c;x.lineWidth=4;x.lineCap="round";x.beginPath();x.moveTo(0,0);x.quadraticCurveTo(-7,10,3,18);x.stroke();
 const g=x.createRadialGradient(-2,-12,1,0,-8,12);g.addColorStop(0,"#fff6");g.addColorStop(1,c);
 x.fillStyle=c;x.beginPath();x.ellipse(0,-6,6.5,11,0,0,7);x.fill();x.fillStyle=g;x.fill();
 x.fillStyle=c;x.beginPath();x.arc(0,-20,5,0,7);x.fill();

   const m=JSON.parse(e.data);
   if((m.team!=="b"&&m.team!=="g")||typeof m.gift!=="string")return;
   const card=GIFTS.find(v=>v.name===m.gift);if(!card)return;
   gift(m.team,card,m.user);
  }catch(err){console.warn("Evento inválido recebido",err)}};
  socket.onerror=()=>setConnection("disconnected","Falha na conexão com o servidor");
  socket.onclose=()=>{
   setConnection("disconnected","Servidor desconectado • tentando reconectar");
   clearTimeout(retryTimer);retryTimer=setTimeout(()=>conectar(url),retryDelay);
   retryDelay=Math.min(retryDelay*2,15000);
  };
 }catch(err){setConnection("disconnected","Não foi possível conectar ao servidor")}
}
const q=new URLSearchParams(location.search).get("ws");
const wsProtocol=location.protocol==="https:"?"wss://":"ws://";
if(q){try{const parsed=new URL(q,location.href);if(parsed.protocol==="ws:"||parsed.protocol==="wss:")conectar(parsed.href)}catch(_){setConnection("disconnected","Endereço WebSocket inválido")}}
else if(location.protocol==="http:"||location.protocol==="https:")conectar(wsProtocol+location.host);
</script>
